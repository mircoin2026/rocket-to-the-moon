<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080c22">
<title>Rocket to the Moon</title>
<meta name="description" content="Космическая аркада и Telegram Mini App на MIRCOIN и Telegram Stars">
<meta property="og:title" content="Rocket to the Moon">
<meta property="og:description" content="Космическая аркада и Telegram Mini App на MIRCOIN и Telegram Stars">
<meta property="og:type" content="website">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080c22;--panel:#111936;--panel2:#182344;--line:#29395f;--text:#f2f5ff;--muted:#98a8cc;--cyan:#57e4ff;--blue:#627bff;--gold:#ffc866;--pink:#ff72bc;--green:#69f2b1;--safeB:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{overflow:hidden}
button,input,select{font:inherit}
button{color:inherit;touch-action:manipulation;cursor:pointer}
a.btn{text-decoration:none;color:inherit}
#app{height:var(--tg-viewport-height,100dvh);min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;background-color:var(--bg);background:radial-gradient(ellipse at 72% -10%,#20366b 0,transparent 43%),linear-gradient(160deg,#0d1431 0%,#080c22 66%);padding-top:max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px))}
#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.8}
header{position:relative;z-index:1;flex:none;padding:10px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d;background:linear-gradient(#080c22a8,transparent)}
.brand{display:flex;align-items:center;gap:10px}
.brandIcon{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#72efff,#627bff);display:grid;place-items:center;box-shadow:0 0 25px #57e4ff43;font-size:21px}
.brand h1{font-size:15px;letter-spacing:.01em;margin:0;font-weight:850}
.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px;letter-spacing:.1em;text-transform:uppercase}
.headActions{display:flex;gap:7px;align-items:center}
.balance{border:1px solid #ffc86652;background:#ffc86612;color:var(--gold);border-radius:14px;padding:7px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.iconBtn{width:39px;height:39px;border-radius:13px;border:1px solid var(--line);background:#111936d9;font-size:17px;flex:none}
.iconBtn.active{border-color:var(--cyan);color:var(--cyan);background:#57e4ff18}
.adminHeadBtn{height:39px;padding:0 10px;border-radius:13px;border:1px solid #ffc86675;background:linear-gradient(135deg,#413219,#241c2c);color:#ffe09c;font-size:11px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;box-shadow:0 3px 12px #ffc86622;flex:none}
.adminHeadBtn.active{border-color:var(--cyan);color:var(--cyan);background:#57e4ff1c;box-shadow:0 0 14px #57e4ff2a}
main{position:relative;z-index:1;flex:1;overflow-y:auto;padding:12px 14px calc(88px + var(--safeB));scrollbar-width:none}
main::-webkit-scrollbar{display:none}
nav{position:absolute;z-index:5;bottom:0;left:0;right:0;padding:8px 8px calc(8px + var(--safeB));display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:linear-gradient(0deg,#0b1027 75%,#0b1027eb);border-top:1px solid #ffffff12}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7f91b7;font-size:9px;font-weight:750;min-height:51px;border-radius:12px}
nav button .ni{font-size:19px;line-height:1}
nav button.active{color:var(--cyan);background:#57e4ff12}
nav button[data-id=shop]{
  color:#ffe0a0;
  border:1px solid #ffc86655;
  background:linear-gradient(155deg,#40351f,#241d27);
  box-shadow:0 3px 14px #ffc86625,inset 0 1px #ffffff18;
}
nav button[data-id=shop] .ni{
  display:grid;
  place-items:center;
  width:27px;
  height:25px;
  border:1px solid #ffc86655;
  border-radius:8px;
  color:#ffd27d;
  background:linear-gradient(145deg,#775326,#3c2d27);
  filter:drop-shadow(0 0 5px #ffc86645);
}
.card{border:1px solid #ffffff12;border-radius:19px;background:linear-gradient(145deg,#172244ed,#101833f2);box-shadow:0 12px 36px #02061736;overflow:hidden;margin-bottom:12px}
.cardPad{padding:15px}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 2px 10px}
.sectionHead h2{margin:0;font-size:17px;letter-spacing:-.02em}
.sectionHead p{margin:4px 0 0;color:var(--muted);font-size:11px}
.pill{font-size:10px;font-weight:800;border:1px solid #57e4ff45;color:var(--cyan);background:#57e4ff10;border-radius:99px;padding:6px 9px;white-space:nowrap}
.hero{height:174px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 72% 93%,#f8b75d55,transparent 30%),linear-gradient(145deg,#18275b,#101630 67%,#221c49)}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-20px;top:14px;background:radial-gradient(circle at 35% 32%,#fff7d9,#e7c4a0 13%,#a988aa 35%,#55477e 67%,#282c5c 71%);box-shadow:0 0 35px #a29ef778}
.heroText{position:absolute;z-index:1;left:17px;top:17px;max-width:65%}
.eyebrow{color:var(--cyan);font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.heroText h2{font-size:22px;line-height:1.08;margin:7px 0 7px;letter-spacing:-.04em}
.heroText p{font-size:11px;line-height:1.45;color:#becbea;margin:0;max-width:240px}
.heroRocket{position:absolute;z-index:2;right:76px;bottom:10px;font-size:66px;transform:rotate(-34deg);filter:drop-shadow(0 0 16px #78eaff9c);animation:float 2.8s ease-in-out infinite}
.heroOrbit{position:absolute;z-index:1;width:115px;height:40px;border:1px solid #d2c8ff77;border-radius:50%;right:20px;top:63px;transform:rotate(-25deg)}
@keyframes float{50%{transform:rotate(-34deg) translateY(-8px)}}
.btn{border:1px solid #ffffff16;border-radius:13px;padding:11px 13px;background:linear-gradient(135deg,#293d77,#1b2851);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px}
.btn.primary{color:#061522;border:0;background:linear-gradient(135deg,#74edff,#55baff);box-shadow:0 5px 18px #48cfff2d}
.btn.gold{color:#2a1b06;border:0;background:linear-gradient(135deg,#ffe19b,#ffb94f)}
.btn.ghost{background:#ffffff08}
.btn.danger{color:#ff9dba;background:#ff457413;border-color:#ff457433}
.btn.ok{color:var(--green);background:#69f2b116;border-color:#69f2b13a}
.btn:disabled{opacity:.42;filter:grayscale(.4);cursor:not-allowed}
.full{width:100%}
.smallBtn{min-height:35px;padding:8px 10px;font-size:11px;border-radius:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid #ffffff0e;border-radius:14px;padding:11px 9px;background:#0a122c80;min-width:0}
.stat strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.slot{padding:12px;border-radius:15px;background:#0a122c80;border:1px solid #ffffff12;margin-bottom:8px}
.slotTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.slotTitle{display:flex;align-items:center;gap:10px}
.rocketBadge{width:41px;height:41px;border-radius:13px;background:linear-gradient(145deg,#263c70,#14203f);display:grid;place-items:center;font-size:22px}
.slotTitle strong{font-size:12px}
.slotTitle small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.status{font-size:9px;border-radius:99px;padding:5px 8px;background:#69f2b11a;color:var(--green);font-weight:850;white-space:nowrap}
.status.busy{color:var(--gold);background:#ffc8661a}
.status.off{color:#ff9dba;background:#ff45741a}
.slotActions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.slotActions>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.raceBoostList{display:grid;gap:7px}
.raceBoostCard{padding:9px 11px;border:1px solid #ffffff12;border-radius:13px;background:#0a122c80;display:flex;align-items:center;justify-content:space-between;gap:8px}
.raceBoostCard strong{display:block;font-size:11px}
.raceBoostCard small{display:block;font-size:9px;margin-top:2px}
.raceBoostBtns{display:flex;gap:6px;flex-shrink:0}
.item{padding:12px;border:1px solid #ffffff12;border-radius:15px;background:#0a122c75;min-width:0}
.item .itemIcon{font-size:26px;height:35px}
.item h3{font-size:12px;margin:5px 0}
.item p{font-size:10px;color:var(--muted);line-height:1.45;margin:0 0 10px;min-height:29px}
.priceLine{color:var(--gold);font-size:10px;font-weight:800;margin-bottom:9px}
.progress{height:8px;border-radius:99px;background:#060b1b;overflow:hidden;border:1px solid #ffffff0d}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4b8bff,#5df0ff);box-shadow:0 0 12px #57e4ff66;transition:width .3s}
.muted{color:var(--muted)}
.tiny{font-size:10px}
.empty{text-align:center;padding:24px 14px;color:var(--muted);font-size:12px}
.raceTrack{display:grid;gap:3px;margin:15px 0 9px}
.raceLane{display:flex;align-items:center;gap:7px;min-height:20px}
.raceLaneName{flex:0 0 72px;min-width:0;color:#a6b7db;font-size:8px;line-height:1.1;overflow-wrap:anywhere}
.raceLane:first-child .raceLaneName{color:var(--cyan);font-weight:850}
.raceLaneTrack{position:relative;flex:1;min-width:0;height:20px;border:1px solid #ffffff14;border-radius:7px;background:repeating-linear-gradient(90deg,#182749 0 9%,#24335c 9% 10%);overflow:hidden}
.raceShip{position:absolute;top:-2px;font-size:16px;line-height:20px;filter:drop-shadow(0 0 5px #ffffff66);transition:left .25s}
.raceMe{filter:drop-shadow(0 0 7px #57e4ff)}
.raceFinish{position:absolute;right:5px;top:2px;bottom:2px;width:2px;background:#fff9;border-radius:2px}
.raceRanks{display:flex;gap:5px;overflow:hidden;margin:11px 0;flex-wrap:wrap}
.rankDot{font-size:9px;color:#a6b7db;background:#ffffff0c;padding:5px 7px;border-radius:8px;white-space:nowrap}
.rankDot.me{color:var(--cyan);background:#57e4ff20}
.task{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #ffffff0b}
.task:last-child{border-bottom:0}
.taskIcon{width:39px;height:39px;border-radius:13px;background:#ffffff0b;display:grid;place-items:center;font-size:19px;flex:none}
.taskBody{flex:1;min-width:0}
.taskBody strong{font-size:11px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.taskBody small{font-size:9px;color:var(--muted);display:block;margin-top:3px;line-height:1.35}
.taskTag{display:inline-flex;align-items:center;padding:2px 6px;border-radius:99px;font-size:8px;font-weight:850;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.taskTag.own{color:var(--cyan);background:#57e4ff18;border:1px solid #57e4ff3b}
.taskTag.sponsor{color:var(--gold);background:#ffc86618;border:1px solid #ffc8663f}
.taskActions{display:flex;gap:5px;flex-shrink:0;align-items:center}
.airdropArt{padding:20px;background:radial-gradient(ellipse at 50% 0%,#7859c35c,transparent 55%),linear-gradient(145deg,#22214e,#111832);text-align:center}
.airdropOrb{font-size:51px;filter:drop-shadow(0 0 19px #be8aff9c);margin:3px}
.airdropArt h2{font-size:22px;margin:4px 0}
.airdropArt p{font-size:11px;line-height:1.5;color:#c0cbe7;margin:0 auto 13px;max-width:280px}
.skin{padding:12px;text-align:center}
.skinSwatch{height:48px;border-radius:12px;margin-bottom:8px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--skin),#111b3b)}
.skinSwatch:after{content:"🚀";position:absolute;inset:4px;font-size:31px;transform:rotate(-25deg);filter:drop-shadow(0 2px 5px #000)}
.skin h3{margin:2px 0 4px;font-size:11px}
.skin small{display:block;color:var(--muted);font-size:9px;margin-bottom:8px}
.settingsRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0c;font-size:11px}
.settingsRow:last-child{border-bottom:0}
input,select{width:100%;min-width:0;color:var(--text);background:#080f26;border:1px solid #33456e;border-radius:9px;padding:8px;font-size:11px;outline:none}
input:focus,select:focus{border-color:var(--cyan)}
.field{display:grid;gap:5px;font-size:9px;color:var(--muted);margin:8px 0}
.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.adminPrice{padding:9px;border:1px solid #ffffff10;border-radius:11px;background:#0a122c}
.adminPrice strong{font-size:10px;display:block;margin-bottom:7px}
.adminPrice label{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.adminPrice label.single{grid-template-columns:1fr}
.adminPrice label input{padding:6px}
.adminTaskItem{padding:10px;border:1px solid #ffffff10;border-radius:12px;background:#0a122c;margin-top:8px}
.adminTaskHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.adminTaskMeta{font-size:9px;color:var(--muted);line-height:1.4;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:9px}
th,td{text-align:left;padding:8px 5px;border-bottom:1px solid #ffffff0e}
th{color:var(--muted);font-weight:700}
td{color:#e8edff}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(82px + var(--safeB));transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#eaf8ff;color:#101a31;padding:10px 14px;border-radius:13px;font-size:11px;font-weight:850;box-shadow:0 7px 30px #0008;transition:.2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:410px){.task{flex-wrap:wrap}.taskActions{width:100%;justify-content:flex-end}}
@media(min-width:600px){main{width:min(100%,560px);margin:0 auto}header{padding-left:max(16px,calc((100% - 560px)/2));padding-right:max(16px,calc((100% - 560px)/2))}nav{padding-left:max(8px,calc((100% - 560px)/2));padding-right:max(8px,calc((100% - 560px)/2))}}
</style>
</head>
<body>
<div id="app">
  <canvas id="sky"></canvas>
  <header>
    <div class="brand"><div class="brandIcon">🚀</div><div><h1>Rocket to the Moon</h1><small>покори свою орбиту</small></div></div>
    <div class="headActions"><div class="balance">🪙 <span id="balance">1 000</span></div><button class="adminHeadBtn" id="adminHeadBtn" data-act="testAdmin" aria-label="Админка" style="display:none">👑 Админка</button><button class="iconBtn" id="settingsHeadBtn" data-act="settings" aria-label="Настройки">⚙️</button></div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div class="toast" id="toast"></div>
</div>
<script>(()=>{
"use strict";
const KEY="rocketMoonPrototypeV1";
const CONFIG_BACKUP_KEY="rocketMoonConfigBackupV1";
const OWNER_ID="8631686158";

const defaults={
  _v:2,
  slots:[{coins:250,stars:15},{coins:1000,stars:50},{coins:3500,stars:120}],
  rockets:[
    {id:"base",name:"Базовая ракета",bonus:0,coins:0,stars:0,icon:"🚀"},
    {id:"comet",name:"Comet-X",bonus:10,coins:1500,stars:30,icon:"☄️"},
    {id:"aura",name:"Aura-S",bonus:30,coins:3000,stars:60,icon:"🛸"},
    {id:"titan",name:"Titan-V",bonus:50,coins:5000,stars:90,icon:"🌠"}
  ],
  flightBoosts:[
    {id:"nitro",name:"Nitro x2",coins:300,stars:25,mult:2},
    {id:"turbo",name:"Turbo x5",coins:900,stars:100,mult:5},
    {id:"warp",name:"Warp x10",coins:2000,stars:250,mult:10}
  ],
  raceBoosts:[
    {id:"micro",name:"Микро-Нитро",coins:150,stars:2,pct:3},
    {id:"dash",name:"Турбо-рывок",coins:400,stars:7,pct:8},
    {id:"warpRace",name:"Варп-импульс",coins:800,stars:15,pct:15}
  ],
  tasks:[
    {id:"channel",type:"own",name:"Подписаться на канал",desc:"Поддержи экипаж — получи награду",url:"",reward:250,icon:"📣",enabled:true,done:false,visited:false},
    {id:"social",type:"sponsor",name:"Следить за новостями",desc:"Будь в курсе новых миссий",url:"",reward:200,icon:"🛰️",enabled:true,done:false,visited:false}
  ],
  skins:[
    {id:"moon",name:"Лунный хром",price:0,coins:0,stars:0,color:"#c7e8ff"},
    {id:"neon",name:"Неоновая комета",price:600,coins:600,stars:15,color:"#62f0ff"},
    {id:"solar",name:"Солнечный шторм",price:1200,coins:1200,stars:30,color:"#ffb84e"},
    {id:"emerald",name:"Изумрудный импульс",price:2000,coins:2000,stars:50,color:"#61f2aa"}
  ],
  economy:{
    flightRewardCoins:1000,
    flightDurationHours:4,
    raceEntryCoins:300,
    raceEntryStars:1,
    raceBasePotCoins:5000,
    raceBoostPotAddCoins:2000,
    racePrize1Pct:50,
    racePrize2Pct:30,
    racePrize3Pct:20,
    dailyBonusCoins:100
  },
  referral:{
    baseUrl:"https://t.me/your_bot/app",
    rewardCoins:200,
    percent:10
  }
};

const clone=x=>JSON.parse(JSON.stringify(x));

function makeGuestId(){
  return "guest-"+Math.random().toString(36).slice(2,8);
}

function normalizeTask(t,fallbackType){
  const type=(t&&t.type==="sponsor")?"sponsor":(t&&t.type==="own"?"own":(fallbackType||"own"));
  return {
    id:String((t&&t.id)||("t"+Date.now()+Math.random().toString(16).slice(2,5))),
    type,
    name:String((t&&t.name)||"Задание"),
    desc:String((t&&t.desc)||""),
    url:safeUrl((t&&t.url)||""),
    reward:Math.max(0,Number(t&&t.reward)||0),
    icon:String((t&&t.icon)||(type==="sponsor"?"🤝":"⭐")),
    enabled:t&&t.enabled===false?false:true,
    done:Boolean(t&&t.done),
    visited:Boolean(t&&t.visited)
  };
}

function normalizeConfig(raw){
  const c=clone(defaults);
  if(!raw||typeof raw!=="object")return c;
  const rawVer=Number(raw._v)||1;
  const backfillV2=rawVer<2;
  if(Array.isArray(raw.slots)&&raw.slots.length){
    c.slots=c.slots.map((d,i)=>{
      const src=raw.slots[i];
      return src?{coins:Math.max(0,Number(src.coins!=null?src.coins:d.coins)||0),stars:Math.max(0,Number(src.stars!=null?src.stars:d.stars)||0)}:d;
    });
  }
  if(Array.isArray(raw.rockets)&&raw.rockets.length){
    c.rockets=c.rockets.map(d=>{
      const src=raw.rockets.find(x=>x&&x.id===d.id);
      return src?Object.assign({},d,{
        coins:Math.max(0,Number(src.coins!=null?src.coins:d.coins)||0),
        stars:Math.max(0,Number(src.stars!=null?src.stars:d.stars)||0),
        bonus:Math.max(0,Number(src.bonus!=null?src.bonus:d.bonus)||0)
      }):d;
    });
  }
  if(Array.isArray(raw.flightBoosts)&&raw.flightBoosts.length){
    c.flightBoosts=c.flightBoosts.map(d=>{
      const src=raw.flightBoosts.find(x=>x&&x.id===d.id);
      if(!src)return d;
      let coinsVal=Math.max(0,Number(src.coins!=null?src.coins:d.coins)||0);
      if(backfillV2&&coinsVal===0&&d.coins>0)coinsVal=d.coins;
      return Object.assign({},d,{
        coins:coinsVal,
        stars:Math.max(0,Number(src.stars!=null?src.stars:d.stars)||0)
      });
    });
  }
  if(Array.isArray(raw.raceBoosts)&&raw.raceBoosts.length){
    c.raceBoosts=c.raceBoosts.map(d=>{
      const src=raw.raceBoosts.find(x=>x&&x.id===d.id);
      if(!src)return d;
      let coinsVal=Math.max(0,Number(src.coins!=null?src.coins:d.coins)||0);
      if(backfillV2&&coinsVal===0&&d.coins>0)coinsVal=d.coins;
      return Object.assign({},d,{
        coins:coinsVal,
        stars:Math.max(0,Number(src.stars!=null?src.stars:d.stars)||0)
      });
    });
  }
  if(Array.isArray(raw.skins)&&raw.skins.length){
    c.skins=c.skins.map(d=>{
      const src=raw.skins.find(x=>x&&x.id===d.id);
      if(!src)return d;
      const coinsVal=Math.max(0,Number(src.coins!=null?src.coins:(src.price!=null?src.price:d.coins))||0);
      let starsVal=Math.max(0,Number(src.stars!=null?src.stars:d.stars)||0);
      if(backfillV2&&starsVal===0&&d.stars>0)starsVal=d.stars;
      return Object.assign({},d,{

      });
    });

      flightRewardCoins:Math.max(0,Number(e.flightRewardCoins!=null?e.flightRewardCoins:c.economy.flightRewardCoins)||0),

      dailyBonusCoins:Math.max(0,Number(e.dailyBonusCoins!=null?e.dailyBonusCoins:c.economy.dailyBonusCoins)||0)
    };
  }
  if(raw.referral&&typeof raw.referral==="object"){

  }
  c._v=2;
  return c;

function mergeTasksFromServer(serverTasks){
  if(!Array.isArray(serverTasks))return;
  const prevMap=new Map();
  getAllTasks().forEach(t=>prevMap.set(t.id,t));
  const defaultIds=new Set(defaults.tasks.map(t=>t.id));
  const nextBuiltIn=[];
  const nextCustom=[];
  const seen=new Set();
  serverTasks.forEach(raw=>{
    if(!raw||!raw.id)return;
    const id=String(raw.id);
    if(seen.has(id))return;
    seen.add(id);
    const prev=prevMap.get(id);
    const norm=normalizeTask(raw,raw.type||"own");
    if(prev){
      if(prev.done)norm.done=true;
      if(prev.visited)norm.visited=true;
    }
    if(defaultIds.has(id))nextBuiltIn.push(norm);
    else nextCustom.push(norm);
  });
  if(serverTasks.length>0){
    s.tasks=nextBuiltIn;
    s.customTasks=nextCustom;
  }
}

function applyServerBundle(data){
  if(!data||typeof data!=="object")return false;
  let applied=false;
  const cfgPayload=data.config&&typeof data.config==="object"?data.config:data;
  if(cfgPayload&&(cfgPayload.slots||cfgPayload.rockets||cfgPayload.flightBoosts||cfgPayload.raceBoosts||cfgPayload.skins||cfgPayload.economy)){
    s.config=normalizeConfig(Object.assign({},s.config,cfgPayload));
    applied=true;
  }
  const refPayload=data.referral&&typeof data.referral==="object"?data.referral:
    (data.refBaseUrl!=null||data.refReward!=null||data.refPercent!=null?{
      baseUrl:data.refBaseUrl,
      rewardCoins:data.refReward,
      percent:data.refPercent
    }:null);
  if(refPayload){
    s.config=normalizeConfig(Object.assign({},s.config,{referral:Object.assign({},getReferralConfig(),refPayload)}));
    s.refPercent=s.config.referral.percent;
    applied=true;
  }
  if(Array.isArray(data.tasks)){
    mergeTasksFromServer(data.tasks);
    applied=true;
  }
  if(applied){
    saveConfigBackup();
    save();
  }
  return applied;
}

async function parseJsonSafe(res){
  if(!res||!res.ok)return null;
  const ct=(res.headers&&res.headers.get("content-type"))||"";
  if(ct&&!/json/i.test(ct))return null;
  try{return await res.json()}catch(_){return null}
}

async function loadFromServer(showFeedback){
  try{
    const res=await apiCall("/api/config",{method:"GET"});
    const data=await parseJsonSafe(res);
    if(data){
      applyServerBundle(data);
      if(!data.referral){
        try{
          const rRes=await apiCall("/api/referral",{method:"GET"});
          const rData=await parseJsonSafe(rRes);
          if(rData)applyServerBundle({referral:rData.referral||rData});
        }catch(_){}
      }
      if(!Array.isArray(data.tasks)){
        try{
          const tRes=await apiCall("/api/tasks",{method:"GET"});
          const tData=await parseJsonSafe(tRes);
          if(tData&&Array.isArray(tData.tasks||tData))applyServerBundle({tasks:tData.tasks||tData});
        }catch(_){}
      }
      serverStatus="synced";
      if(showFeedback)toast("Конфиг загружен с сервера");
      render();
      return true;
    }
    serverStatus="offline";
    if(showFeedback)toast("Сервер недоступен — используется резерв localStorage");
    return false;
  }catch(_){
    serverStatus="offline";
    if(showFeedback)toast("Сервер недоступен — используется резерв localStorage");
    return false;
  }
}

async function syncConfigToServer(section,showFeedback){

  if(!isAuthorizedAdmin())return false;
  const payload={
    section:section||"all",
    config:s.config,
    referral:getReferralConfig(),
    tasks:getAllTasks(),
    initData:getInitDataRaw()
  };
  const endpoints=section==="referral"
    ?[["/api/admin/referral","PUT"],["/api/config","PUT"],["/api/admin/config","POST"]]
    :section==="tasks"
      ?[["/api/admin/tasks","PUT"],["/api/config","PUT"],["/api/admin/config","POST"]]
      :[["/api/config","PUT"],["/api/admin/config","POST"]];
  for(const [url,method] of endpoints){
    try{
      const res=await apiCall(url,{method,body:JSON.stringify(payload)});
      if(res.ok){
        serverStatus="synced";
        if(showFeedback)toast("Сохранено на сервере и в localStorage");
        return true;
      }
      if(res.status===401||res.status===403){
        serverStatus="offline";
        if(showFeedback)toast("Ошибка доступа на сервере — сохранено локально");
        return false;
      }
    }catch(_){}
  }
  serverStatus="offline";
  if(showFeedback)toast("Сохранено локально (резерв localStorage)");
  return false;
}

function initTelegram(){
  if(!telegram)return;
  try{
    const syncViewport=()=>{
      const height=Number(telegram.viewportHeight);
      if(Number.isFinite(height)&&height>0){
        const value=Math.round(height)+"px";
        if(document.documentElement.style.getPropertyValue("--tg-viewport-height")!==value){
          document.documentElement.style.setProperty("--tg-viewport-height",value);
          window.dispatchEvent(new Event("resize"));
        }
      }
      const safe=telegram.safeAreaInset||{};
      ["top","right","bottom","left"].forEach(side=>{
        const inset=Number(safe[side]);
        if(Number.isFinite(inset)&&inset>=0){
          document.documentElement.style.setProperty("--tg-safe-area-inset-"+side,inset+"px");
        }
      });
    };
    const syncTheme=()=>{
      const theme=telegram.themeParams||{};
      const background=theme.bg_color||"#080c22";
      if(typeof telegram.setHeaderColor==="function"){
        telegram.setHeaderColor(theme.secondary_bg_color||background);
      }
      if(typeof telegram.setBackgroundColor==="function")telegram.setBackgroundColor(background);
    };
    syncTheme();syncViewport();
    if(typeof telegram.onEvent==="function"){
      telegram.onEvent("themeChanged",syncTheme);
      telegram.onEvent("viewportChanged",syncViewport);
      telegram.onEvent("safeAreaChanged",syncViewport);
    }
    if(typeof telegram.expand==="function")telegram.expand();
    if(typeof telegram.ready==="function")telegram.ready();
  }catch(error){console.warn("Telegram Mini App initialization failed",error)}
}

function syncRocketBonuses(){
  const target={comet:10,aura:30,titan:50};
  const rows=s.config&&Array.isArray(s.config.rockets)?s.config.rockets:[];
  const changed=[];
  Object.keys(target).forEach(id=>{
    const rocket=rows.find(item=>item.id===id);
    if(rocket&&rocket.bonus!==target[id]){
      changed.push({rocket,bonus:rocket.bonus});
      rocket.bonus=target[id];
    }
  });
  if(!changed.length)return;
  function rollback(message){
    changed.forEach(item=>{item.rocket.bonus=item.bonus});
    try{localStorage.setItem(KEY,JSON.stringify(s))}catch(_){}
    render();toast(message);
  }
  try{localStorage.setItem(KEY,JSON.stringify(s))}
  catch(_){rollback("Не удалось сохранить изменения скорости");return}
  const host=window.BYVE;
  if(host&&host.storage&&typeof host.storage.flush==="function"){
    try{host.storage.flush().catch(()=>{rollback("Не удалось сохранить скорость. Изменения отменены")})}
    catch(_){rollback("Не удалось сохранить скорость. Изменения отменены")}
  }
}

function fmt(n){return Math.floor(Number(n)||0).toLocaleString("ru-RU")}
function esc(x){return String(x!=null?x:"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function sound(freq=520){
  if(muted)return;
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended"){const p=audioCtx.resume();if(p&&typeof p.catch==="function")p.catch(()=>{})}
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine";o.frequency.value=freq;
    g.gain.setValueAtTime(.055,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.16);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+.17);
  }catch(_){}
}

let payInFlight=false;
async function starsPayReal(amount,meta){
  amount=Math.max(0,Number(amount)||0);
  if(amount<=0)return true;
  if(payInFlight){toast("Оплата уже выполняется");return false}
  payInFlight=true;
  try{
    const webApp=window.Telegram&&window.Telegram.WebApp;
    if(!webApp||typeof webApp.openInvoice!=="function"){
      return starsPayLocal(amount);
    }
    try{
      const res=await apiCall("/stars/invoice",{
        method:"POST",
        body:JSON.stringify(Object.assign({amountStars:amount,currency:"XTR"},meta||{}))
      });
      if(!res.ok){
        return starsPayLocal(amount);
      }
      const data=await res.json().catch(()=>({}));
      const invoiceUrl=data.invoiceUrl||data.url||"";
      const orderId=data.orderId||data.id||"";
      if(!invoiceUrl){
        return starsPayLocal(amount);
      }
      const status=await new Promise(resolve=>{
        try{webApp.openInvoice(invoiceUrl,st=>resolve(String(st||"")))}
        catch(_){resolve("error")}
      });
      if(status==="paid"){
        if(orderId){
          await apiCall("/stars/order/"+encodeURIComponent(String(orderId)),{method:"GET"}).catch(()=>{});
        }
        s.starsSpent+=amount;
        save();
        return true;
      }
      return false;
    }catch(_){
      return starsPayLocal(amount);
    }
  }finally{
    payInFlight=false;
  }
}

function coinPay(amount){amount=Math.max(0,Number(amount)||0);if(s.balance<amount)return false;s.balance-=amount;return true}
function addRocket(id){if(owned(id))return toast("Эта ракета уже в ангаре");if(s.rockets.length>=slotsCap())return toast("Сначала расширь ангар или освободи слот");s.rockets.push({id,owned:true});logEvent("Приобретена ракета "+getRocket(id).name);save();toast("Ракета добавлена в ангар");render()}

function flightDuration(id){
  const r=getRocket(id),bonus=Math.max(0,Number(r.bonus)||0),econ=getEconomy();
  const hours=Math.max(0.1,Number(econ.flightDurationHours)||4);
  return hours*60*60*1000/(1+bonus/100);
}

function launchFlight(id){
  if(!owned(id)||busy(id))return toast("Эта ракета сейчас занята");
  const flightId="f"+now+Math.random().toString(16).slice(2,6);
  s.flights[flightId]={rocket:id,startAt:now,endAt:now+flightDuration(id),claimed:false};
  logEvent(getRocket(id).name+" отправлена в базовый полёт");
  sound(640);save();
  toast("Ракета отправлена! Награда после возвращения.");
  render();
}

function flightRemaining(f){return Math.max(0,f.endAt-now)}
function durationText(ms){let sec=Math.ceil(ms/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),ss=sec%60;return h?`${h}ч ${m}м`:`${m}м ${ss}с`}

function settle(){
  let changed=false;
  const reward=getEconomy().flightRewardCoins;
  for(const [id,f] of Object.entries(s.flights)){
    if(!f.claimed&&f.endAt<=now){
      f.claimed=true;
      rewardCoinGain(reward);
      logEvent(`${getRocket(f.rocket).name} вернулась: +${fmt(reward)} MIRCOIN`);
      changed=true;
    }
  }
  if(s.race&&s.race.status==="running"&&now>=s.race.endsAt){
    finishRace();
    return;
  }
  if(changed){
    save();
    if(!s.admin)render();
    else headerSync();
  }
}

function finishRace(){
  const r=s.race;if(!r||r.status!=="running")return;
  const econ=getEconomy();
  r.userProgress=Math.min(1.2,r.userProgress);
  const all=[{name:"Ты",p:r.userProgress,me:true},...r.bots.map(b=>({name:b.name,p:b.progress,me:false}))].sort((a,b)=>b.p-a.p);
  r.place=all.findIndex(x=>x.me)+1;r.status="finished";r.results=all.slice(0,3).map(x=>x.name);
  const shares={
    1:(Number(econ.racePrize1Pct)||0)/100,
    2:(Number(econ.racePrize2Pct)||0)/100,
    3:(Number(econ.racePrize3Pct)||0)/100
  };
  const prize=Math.floor(r.pot*(shares[r.place]||0));
  if(prize){rewardCoinGain(prize);logEvent(`Космическая гонка: место ${r.place}, награда ${fmt(prize)} MIRCOIN`)}
  else logEvent(`Космическая гонка завершена: место ${r.place}`);
  toast(r.place<=3?`Финиш! ${r.place} место — +${fmt(prize)} MIRCOIN`:`Финиш! Место ${r.place}`);
  sound(r.place<=3?800:300);save();render();
}

async function startRace(id,pay){
  if(!owned(id)||busy(id))return toast("Нужна свободная ракета");
  if(pay!=="coins"&&pay!=="stars")return toast("Выбери способ оплаты");
  const econ=getEconomy();
  const entryCoins=Math.max(0,Number(econ.raceEntryCoins)||0);
  const entryStars=Math.max(0,Number(econ.raceEntryStars)||0);
  const paid=pay==="coins"
    ?coinPay(entryCoins)
    :await starsPayReal(entryStars,{purchaseType:"race_entry",itemId:String(id)});
  if(!paid)return toast(pay==="coins"?`Не хватает ${fmt(entryCoins)} MIRCOIN`:"Оплата Stars не выполнена");
  const bots=Array.from({length:9},(_,i)=>({name:["Луна-7","КосмоКот","Звёздный Лис","Орбита","Искра","Комета","Нова","Пульсар","Спутник"][i],progress:0,pace:.0125+Math.random()*.004}));
  s.race={status:"running",rocket:id,startAt:now,endsAt:now+60000,pot:Math.max(0,Number(econ.raceBasePotCoins)||0),userProgress:0,bots,boosts:0};
  logEvent("Стартовала платная гонка на 10 пилотов");
  sound(720);toast("Десять пилотов на старте!");save();render();
}

async function raceBoost(id,pay){
  const b=conf().raceBoosts.find(x=>x.id===id);
  if(!b||!s.race||s.race.status!=="running")return;
  const mode=pay==="coins"?"coins":"stars";
  const cost=mode==="coins"?Math.max(0,Number(b.coins)||0):Math.max(0,Number(b.stars)||0);
  const ok=mode==="coins"
    ?coinPay(cost)
    :await starsPayReal(cost,{purchaseType:"race_boost",itemId:String(b.id)});
  if(!ok)return toast(mode==="coins"?"Не хватает MIRCOIN":"Оплата Stars не выполнена");
  const potAdd=Math.max(0,Number(getEconomy().raceBoostPotAddCoins)||0);
  s.race.userProgress+=b.pct/100;
  s.race.pot+=potAdd;
  s.race.boosts++;
  logEvent(`${b.name}: +${b.pct}% пути, банк +${fmt(potAdd)}`);
  sound(950);save();render();
}

async function accelerate(fid,id,pay){
  const b=conf().flightBoosts.find(x=>x.id===id),f=s.flights[fid];
  if(!b||!f||f.claimed)return;
  const mode=pay==="coins"?"coins":"stars";
  const cost=mode==="coins"?Math.max(0,Number(b.coins)||0):Math.max(0,Number(b.stars)||0);
  const ok=mode==="coins"
    ?coinPay(cost)
    :await starsPayReal(cost,{purchaseType:"flight_boost",itemId:String(b.id),flightId:String(fid)});

  sound(900);save();render();
}

function openExternalLink(url){
  const clean=safeUrl(url);
  if(!clean)return;
  try{
    if(telegram){
      if(/^https:\/\/t\.me\//i.test(clean)&&typeof telegram.openTelegramLink==="function"){
        telegram.openTelegramLink(clean);
        return;
      }
      if(typeof telegram.openLink==="function"){
        telegram.openLink(clean);
        return;
      }
    }
  }catch(_){}
  const a=document.createElement("a");
  a.href=clean;a.target="_blank";a.rel="noopener noreferrer";
  document.body.appendChild(a);a.click();a.remove();
}

function buildReferralLink(forId){
  const uid=forId||getTelegramUserId()||String(s.userId||"guest");
  const refCode="ref_"+encodeURIComponent(uid);
  let base=getReferralConfig().baseUrl;
  if(base.includes("{code}")||base.includes("{id}")){
    return base.replace(/\{code\}/g,refCode).replace(/\{id\}/g,encodeURIComponent(uid));
  }
  if(/[?&=]$/.test(base))return base+refCode;
  if(base.includes("?")){
    return /[?&](startapp|start)=/i.test(base)?base:base+"&startapp="+refCode;
  }
  return base+"?startapp="+refCode;
}

  const link=buildReferralLink();

  else toast(link);

function update(dt){
  now+=dt*1000;
  settle();
  document.querySelectorAll("[data-timer]").forEach(el=>{
    const f=s.flights[el.dataset.timer];
    if(f)el.textContent=durationText(flightRemaining(f));
  });
  const rt=document.querySelector("[data-race-timer]");
  if(s.race&&s.race.status==="running"){
    const d=Math.max(0,dt);
    s.race.userProgress+=d*(.0125+getRocket(s.race.rocket).bonus*.000045);
    s.race.bots.forEach(b=>b.progress+=d*b.pace);
    if(rt)rt.textContent=durationText(Math.max(0,s.race.endsAt-now));
    document.querySelectorAll(".raceShip").forEach(ship=>{
      const value=ship.dataset.racer==="me"?s.race.userProgress:(s.race.bots[Number(ship.dataset.racer)]&&s.race.bots[Number(ship.dataset.racer)].progress);
      if(Number.isFinite(value))ship.style.left=`calc(${Math.min(90,Math.max(0,value*100))}% - 5px)`;
    });
    const bar=document.querySelector(".raceTrack + .progress > i");
    if(bar)bar.style.width=`${Math.min(100,s.race.userProgress*100)}%`;
    if(Math.floor(now/1000)!==Math.floor((now-d*1000)/1000))save();
  }
}

function think(side,world){
  const available=world.rockets.find(x=>x.owned&&!world.busy(x.id));
  if(!available)return null;
  if(side==="player"||side==="demo")return {type:"race",rocket:available.id};
  return {type:"flight",rocket:available.id};
}

function actDemo(){
  const choice=think("demo",{rockets:s.rockets,busy});
  if(choice&&choice.type==="race")startRace(choice.rocket,"coins");
}

function applyPriceInputChange(el){
  const key=el.dataset.price,currency=el.dataset.currency,value=Math.max(0,Number(el.value)||0),c=conf();
  if(key.startsWith("slot")){const p=c.slots[Number(key.slice(4))];if(p)p[currency]=value}
  else if(key.startsWith("rocket")){const p=c.rockets.find(x=>x.id===key.slice(6));if(p)p[currency]=value}
  else if(key.startsWith("flight")){const p=c.flightBoosts.find(x=>x.id===key.slice(6));if(p)p[currency]=value}
  else if(key.startsWith("race")){const p=c.raceBoosts.find(x=>x.id===key.slice(4));if(p)p[currency]=value}
  else if(key.startsWith("skin")){
    const p=c.skins.find(x=>x.id===key.slice(4));
    if(p){
      p[currency]=value;
      if(currency==="coins")p.price=value;
    }
  }
}

function applyEconInputChange(el){
  const key=el.dataset.econ;
  if(!s.config.economy)s.config.economy=clone(defaults.economy);
  let val=Number(el.value);
  if(!Number.isFinite(val)||val<0)val=0;
  if(key==="flightDurationHours")val=Math.max(0.1,val);
  if(key==="racePrize1Pct"||key==="racePrize2Pct"||key==="racePrize3Pct")val=Math.min(100,val);
  s.config.economy[key]=val;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!b)return;
  sound(520);
  const a=b.dataset.act,id=b.dataset.id,pay=b.dataset.pay;

  if(a==="tab")return setTab(id);
  if(a==="settings"){s.settings=!s.settings;s.admin=false;confirmResetUntil=0;return render()}
  if(a==="launch")return launchFlight(id);
  if(a==="raceStart")return startRace(id,pay);
  if(a==="raceBoost")return raceBoost(id,pay);
  if(a==="accelerate")return accelerate(id,b.dataset.boost,pay);
  if(a==="buySlot")return buySlot(+b.dataset.index,pay);
  if(a==="buyRocket")return buyRocket(id,pay);
  if(a==="buySkin")return buySkin(id,pay);
  if(a==="equipSkin"){if(s.skinsOwned.includes(id)){s.skin=id;save();toast("Облик надет");render()}return}
  if(a==="assign"){
    const slot=+b.dataset.slot;
    if(s.slots[slot]&&!busy(id)){s.slots[slot].rocket=id;toast("Ракета назначена в слот");save();render()}
    return;
  }
  if(a==="daily")return checkDaily();
  if(a==="visitTask")return visitTask(id);
  if(a==="task")return claimTask(id);
  if(a==="copyRef")return copyReferral();
  if(a==="refDemo")return claimReferral();
  if(a==="mute"){muted=!muted;render();return}
  if(a==="reset"){
    if(now>=confirmResetUntil){
      confirmResetUntil=now+4000;
      toast("Нажми ещё раз для подтверждения сброса");
      return render();
    }
    confirmResetUntil=0;
    localStorage.removeItem(KEY);
    s=fresh();
    syncIdentity();
    try{
      const backup=JSON.parse(localStorage.getItem(CONFIG_BACKUP_KEY)||"null");
      if(backup&&backup.config)s.config=normalizeConfig(backup.config);
    }catch(_){}
    events=[];now=Date.now();
    bindReferralFromStart();
    save();
    toast("Прогресс сброшен");
    render();
    return;
  }
  if(a==="pauseRace"){toast("Пауза — только интерфейс; таймер гонки продолжается");return}

  // Strictly Admin-only actions (OWNER_ID = 8631686158)
  if(!isAuthorizedAdmin()){
    s.admin=false;
    return toast("Доступ только для администратора");
  }

  if(a==="testAdmin"){s.admin=!s.admin;s.settings=false;save();return render()}
  if(a==="admin"){s.admin=true;s.settings=false;return render()}
  if(a==="adminOff"){s.admin=false;save();return render()}
  if(a==="syncLoad"){loadFromServer(true);return}
  if(a==="syncSaveAll"){
    document.querySelectorAll("[data-price]").forEach(applyPriceInputChange);
    document.querySelectorAll("[data-econ]").forEach(applyEconInputChange);
    syncConfigToServer("all",true);
    return;
  }
  if(a==="syncSavePrices"){
    document.querySelectorAll("[data-price]").forEach(applyPriceInputChange);
    document.querySelectorAll("[data-econ]").forEach(applyEconInputChange);
    syncConfigToServer("config",true);
    return;
  }
  if(a==="saveRefSettings"){
    const urlInp=document.getElementById("refBaseUrlInput");
    const rewInp=document.getElementById("refRewardInput");
    const pctInp=document.getElementById("refPercentInput");
    const baseUrl=safeUrl(urlInp&&urlInp.value)||defaults.referral.baseUrl;
    const rewardCoins=Math.max(0,Number(rewInp&&rewInp.value)||0);
    const percent=Math.min(100,Math.max(0,Number(pctInp&&pctInp.value)||0));
    s.config.referral={baseUrl,rewardCoins,percent};
    s.refPercent=percent;
    logEvent(`Обновлены реф-настройки: +${fmt(rewardCoins)} 🪙, ${percent}%`);
    syncConfigToServer("referral",true);
    return render();
  }
  if(a==="grant"){
    s.balance+=1000;s.stars+=100;
    logEvent("Админ: начислены ресурсы");
    save();toast("Ресурсы начислены");render();return;
  }
  if(a==="finishFlights"){
    for(const f of Object.values(s.flights))if(!f.claimed)f.endAt=now;
    settle();toast("Полёты завершены");save();render();return;
  }
  if(a==="addTask"){
    const typeEl=document.getElementById("taskType");
    const nameEl=document.getElementById("taskName");
    const descEl=document.getElementById("taskDesc");
    const urlEl=document.getElementById("taskUrl");
    const rewEl=document.getElementById("taskReward");
    const iconEl=document.getElementById("taskIcon");
    const type=typeEl&&typeEl.value==="sponsor"?"sponsor":"own";
    const name=(nameEl&&nameEl.value.trim())||"";
    const desc=(descEl&&descEl.value.trim())||(type==="sponsor"?"Спонсорское задание":"Задание от проекта");
    const rawUrl=(urlEl&&urlEl.value.trim())||"";
    const url=safeUrl(rawUrl);
    if(rawUrl&&!url)return toast("Ссылка должна начинаться с https://, http:// или tg://");
    if(!name)return toast("Введи название задания");
    const reward=Math.max(0,Number(rewEl&&rewEl.value)||0);
    const icon=(iconEl&&iconEl.value.trim())||(type==="sponsor"?"🤝":"⭐");
    const task=normalizeTask({
      id:"task_"+now+"_"+Math.random().toString(16).slice(2,5),
      type,name,desc,url,reward,icon,enabled:true,done:false,visited:false
    },type);
    s.customTasks.push(task);
    syncConfigToServer("tasks",true);
    render();
    return;
  }
  if(a==="toggleTask"){
    const t=getAllTasks().find(x=>x.id===id);
    if(!t)return;
    t.enabled=t.enabled===false?true:false;
    syncConfigToServer("tasks",true);
    render();
    return;
  }
  if(a==="delTask"){
    s.tasks=s.tasks.filter(t=>t.id!==id);
    s.customTasks=s.customTasks.filter(t=>t.id!==id);
    syncConfigToServer("tasks",true);
    render();
    return;
  }
});

document.addEventListener("change",e=>{
  const el=e.target;
  if(!el)return;
  if(el.id==="refPercentInput"||el.id==="refRewardInput"||el.id==="refBaseUrlInput"){

    syncConfigToServer("referral",false);

    toast("Настройка сохранена");
  }
});

document.addEventListener("visibilitychange",()=>{if(document.hidden){save()}else{now=Date.now();render()}});

function drawSky(){
  const canvas=document.getElementById("sky"),ctx=canvas.getContext("2d");
  let w=0,h=0,stars=[];
  function resize(){
    const d=Math.min(2,devicePixelRatio||1);
    w=innerWidth;h=innerHeight;canvas.width=w*d;canvas.height=h*d;
    ctx.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:75},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.25,p:Math.random()*6.28}));
  }
  resize();addEventListener("resize",resize);
  let t=0;
  function frame(){
    t+=.016;ctx.clearRect(0,0,w,h);
    for(const q of stars){
      const alpha=.22+.5*(.5+.5*Math.sin(t*1.5+q.p));
      ctx.fillStyle=`rgba(190,222,255,${alpha})`;
      ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();
    }
    for(let i=0;i<3;i++){
      const x=(w*.22+i*w*.29+(t*8*(i+1))%(w+40))-20,y=(h*.13+i*h*.21+Math.sin(t+i)*5);
      ctx.fillStyle="#8fdcff77";ctx.fillRect(x,y,2,2);
    }
    requestAnimationFrame(frame);
  }
  frame();
}

function appUpdate(){
  const stamp=Date.now();
  const dt=Math.min(.25,Math.max(0,(stamp-now)/1000));
  if(dt>0){now=stamp;update(dt)}
}

function start(){
  s.settings=false;s.admin=false;
  if(!s.tab)s.tab="hangar";
  render();
}

window.GAME_TEST={
  start,
  demo(on){
    demoMode=!!on;
    if(on){
      s.settings=false;s.admin=false;s.tab="race";
      if(!s.race||s.race.status!=="running")actDemo();
      render();
    }
  },
  step(seconds){
    let n=Math.max(0,Math.ceil(seconds*60));
    for(let i=0;i<n;i++)update(1/60);
    render();
  },
  state(){
    const progress=(s.race&&s.race.userProgress)||0;
    return{
      phase:(s.race&&s.race.status)==="finished"?"over":"play",
      score:s.balance,
      opponentScore:(s.race&&s.race.pot)||0,
      round:s.race?1:0,
      player:{x:progress,y:0},
      opponents:((s.race&&s.race.bots)||[]).map(b=>({x:b.progress,y:0})),
      events:[...(s.events||[])]
    };
  }
};
window.think=think;

syncIdentity();
bindReferralFromStart();
syncRocketBonuses();
initTelegram();
drawSky();
render();
loadFromServer(false);
setInterval(appUpdate,250);
})();</script>
